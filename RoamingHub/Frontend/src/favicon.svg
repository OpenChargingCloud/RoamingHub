<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RoamingHub">
    <rect x="4" y="4" width="56" height="56" rx="12" fill="#1b5f7f"/>
    <!-- The spokes first, so the nodes sit on top of them. -->
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.65">
        <line x1="32" y1="32" x2="16" y2="18"/>
        <line x1="32" y1="32" x2="48" y2="18"/>
        <line x1="32" y1="32" x2="16" y2="46"/>
        <line x1="32" y1="32" x2="48" y2="46"/>
    </g>
    <!-- The peers around it ... -->
    <g fill="#ffffff" opacity="0.92">
        <circle cx="16" cy="18" r="5"/>
        <circle cx="48" cy="18" r="5"/>
        <circle cx="16" cy="46" r="5"/>
        <circle cx="48" cy="46" r="5"/>
    </g>
    <!-- ... and the hub they are all peered with. -->
    <circle cx="32" cy="32" r="9" fill="#ffffff"/>
    <circle cx="32" cy="32" r="4" fill="#1b5f7f"/>
</svg>
